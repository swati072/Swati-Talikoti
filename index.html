<!DOCTYPE html>
<html>
<head>
  <title>Spur Gear Calculator</title>

  <!-- Light Mode Styling -->
  <style>
    body {
      font-family: Arial;
      background: #ffffff;
      color: #333;
      text-align: center;
    }

    .container {
      width: 400px;
      margin: auto;
      padding: 20px;
    }

    button {
      margin: 10px;
      padding: 10px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }

    input, select {
      display: block;
      margin: 10px auto;
      padding: 8px;
    }

    .page {
      display: none;
    }

    .active {
      display: block;
    }
  </style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="container page active">
  <h1>Spur Gear Calculation</h1>
  <p>Step-by-step gear design calculator</p>
  <button onclick="goToPage(2)">Next</button>
</div>

<!-- PAGE 2 -->
<div id="page2" class="container page">
  <h2>Select Question Type</h2>
  <button onclick="selectType(1)">Type 1</button>
  <button onclick="selectType(2)">Type 2</button>
  <button onclick="selectType(3)">Type 3</button>
</div>

<!-- PAGE 3 -->
<div id="page3" class="container page">

  <h2>Spur Gear Calculator</h2>

  <!-- Material -->
  <label>Material:</label>
  <select id="material">
    <option>Steel</option>
    <option>Cast Iron</option>
    <option>Aluminium</option>
  </select>

  <!-- Inputs -->
  <label>Number of Teeth:</label>
  <input type="number" id="teeth" value="20">

  <label>Module:</label>
  <input type="number" id="module" value="2">

  <button onclick="calculate()">Calculate</button>

  <!-- Gear Diagram -->
  <canvas id="gearCanvas" width="300" height="300"></canvas>

  <!-- Results -->
  <div id="results"></div>

  <!-- Actions -->
  <button onclick="downloadPDF()">Download PDF</button>
  <button onclick="window.print()">Print</button>

</div>

<!-- PDF LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
/* PAGE NAVIGATION */
function goToPage(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("page" + page).classList.add("active");
}

function selectType(type) {
  localStorage.setItem("questionType", type);
  goToPage(3);
}

/* CALCULATION */
function calculate() {
  let teeth = parseInt(document.getElementById("teeth").value);
  let module = parseFloat(document.getElementById("module").value);

  let pitchDiameter = module * teeth;
  let addendum = module;
  let dedendum = 1.25 * module;

  let resultHTML = `
    <h3>Detailed Calculation</h3>
    Pitch Diameter = ${pitchDiameter}<br>
    Addendum = ${addendum}<br>
    Dedendum = ${dedendum}
  `;

  document.getElementById("results").innerHTML = resultHTML;

  drawGear(teeth);
}

/* DRAW GEAR */
function drawGear(teeth) {
  let canvas = document.getElementById("gearCanvas");
  let ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let centerX = 150;
  let centerY = 150;
  let radius = 80;

  for (let i = 0; i < teeth; i++) {
    let angle = (i * 2 * Math.PI) / teeth;

    let x = centerX + radius * Math.cos(angle);
    let y = centerY + radius * Math.sin(angle);

    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(x, y);
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
  ctx.stroke();
}

/* PDF DOWNLOAD */
function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let content = document.getElementById("results").innerText;

  doc.text("Spur Gear Calculation", 10, 10);
  doc.text(content, 10, 20);

  doc.save("gear_calculation.pdf");
}
</script>

</body>
</html>
