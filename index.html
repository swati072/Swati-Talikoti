<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spur Gear Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #2c3e50;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 80%;
      margin: auto;
      padding: 20px;
      text-align: center;
    }
    button {
      background: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover { background: #2980b9; }
    .hidden { display: none; }
    #gearCanvas { width: 600px; height: 400px; margin: auto; }
    .calc-section { text-align: left; margin-top: 20px; }
  </style>
</head>
<body>
<div class="container">

  <!-- Page 1 -->
  <div id="page1">
    <h1>SPUR GEAR CALCULATION</h1>
    <button onclick="goToPage(2)">Next</button>
  </div>

  <!-- Page 2 -->
  <div id="page2" class="hidden">
    <h2>Select Question Type</h2>
    <button onclick="goToPage(3)">Type 1</button>
    <button onclick="alert('Type 2 flow not implemented yet')">Type 2</button>
    <button onclick="alert('Type 3 flow not implemented yet')">Type 3</button>
    <button onclick="goToPage(1)">Back</button>
  </div>

  <!-- Page 3 (Type 1) -->
  <div id="page3" class="hidden">
    <h2>Type 1 Calculation</h2>
    <label>Material:
      <select id="material">
        <option>Steel</option>
        <option>Aluminum</option>
        <option>Plastic</option>
      </select>
    </label><br><br>
    <label>Number of Teeth:
      <input type="number" id="teeth" value="50">
    </label><br><br>
    <button onclick="generateGear()">Calculate</button>

    <div id="gearCanvas"></div>

    <div class="calc-section" id="calcDetails"></div>

    <button onclick="goToPage(2)">Back</button>
    <button onclick="downloadPDF()">Download PDF</button>
    <button onclick="window.print()">Print</button>
  </div>

</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
function goToPage(n) {
  document.querySelectorAll('.container > div').forEach(div => div.classList.add('hidden'));
  document.getElementById('page'+n).classList.remove('hidden');
}

function generateGear() {
  const teeth = parseInt(document.getElementById("teeth").value);
  const material = document.getElementById("material").value;

  // Clear old canvas
  document.getElementById("gearCanvas").innerHTML = "";

  // Setup Three.js
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, 600/400, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(600, 400);
  document.getElementById("gearCanvas").appendChild(renderer.domElement);

  // Gear geometry (simplified circle with teeth segments)
  const geometry = new THREE.CircleGeometry(5, teeth);
  const materialMesh = new THREE.MeshBasicMaterial({ color: 0x3498db, wireframe: true });
  const gear = new THREE.Mesh(geometry, materialMesh);
  scene.add(gear);

  camera.position.z = 10;

  function animate() {
    requestAnimationFrame(animate);
    gear.rotation.z += 0.01;
    renderer.render(scene, camera);
  }
  animate();

  // Show calculation details
  const details = `
    <h3>Detailed Calculation</h3>
    <p>Material Selected: ${material}</p>
    <p>Number of Teeth: ${teeth}</p>
    <p>Pitch Circle Diameter ≈ ${teeth * 2} mm (example)</p>
    <p>Module ≈ ${(teeth * 2 / teeth).toFixed(2)} mm</p>
    <p>Pressure Angle: 20° (standard)</p>
  `;
  document.getElementById("calcDetails").innerHTML = details;
}

function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text("Spur Gear Calculation Results", 10, 10);
  doc.text(document.getElementById("calcDetails").innerText, 10, 20);
  doc.save("gear_calculation.pdf");
}
</script>
</body>
</html>
